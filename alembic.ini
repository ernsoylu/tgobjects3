# Alembic configuration for tgobjects3.
#
# The database URL is supplied at runtime from the DATABASE_URL environment
# variable (see gateway/app/db/migrations/env.py); it is intentionally NOT
# stored here so that credentials never live in a committed file. The
# sqlalchemy.url key is left blank for that reason.

[alembic]
# Path to migration scripts, relative to this file.
script_location = gateway/app/db/migrations

# Template used to generate migration file names. A zero-padded, incrementing
# revision prefix keeps the versions directory readable in commit order.
file_template = %%(rev)s_%%(slug)s

# Use OS-native path separators in version_locations.
version_path_separator = os

# Timezone for timestamps rendered into migration files.
timezone = UTC

# Left blank on purpose. env.py reads DATABASE_URL from the environment and
# normalises it to the asyncpg driver.
sqlalchemy.url =


[post_write_hooks]
# No post-write hooks configured; formatting is handled by ruff via the
# Makefile `lint` target.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
